name: Generate India IPTV Playlist

on:
  schedule:
    - cron: "0 3 * * 1"      # every Monday 03:00 UTC (08:30 IST)
  workflow_dispatch:          # lets you press "Run workflow" manually

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape & Generate Playlist
    runs-on: ubuntu-latest
    timeout-minutes: 45       # hard stop so a stuck run can never burn 1+ hour

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Scrape & Generate Playlist
        run: python main.py --pages 10 --workers 40 --stable-wait 90 --repo ${{ github.repository }}

      - name: Commit & Push Playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output README.md
          git diff --cached --quiet || git commit -m "Update playlist"
          git push
